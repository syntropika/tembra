[package]
name = "tembra-testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Integration fixtures and diagnostic tools for real Tembra runtimes"
publish = false

[features]
default = ["native", "codegen"]
native = ["tembra/native"]
codegen = ["dep:tembra-codegen"]
embedded-executor = ["dep:tembra-executor-js"]

[dependencies]
serde.workspace = true
schemars.workspace = true
tembra-contracts.workspace = true
tembra-hooks.workspace = true
tembra.workspace = true
tembra-codegen = { path = "../../crates/codegen", optional = true }
tembra-executor-js = { path = "../../crates/executor-js", optional = true }
futures.workspace = true
serde_json.workspace = true
tembra-core.workspace = true
tembra-native = { path = "../../crates/native" }
tokio = { version = "1.53.3", features = ["rt", "time", "net", "sync", "io-util", "signal"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "connect"] }

[lints]
workspace = true

# Execute the actual production CLI entrypoint without colliding with its distribution binary.
[[bin]]
name = "tembra-testing-codegen"
path = "../../crates/codegen/src/main.rs"
required-features = ["codegen"]

[[test]]
name = "example-counter"
path = "tests/examples/counter.rs"
required-features = ["native"]

