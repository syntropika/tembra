[workspace]
members = [
  "crates/core",
  "crates/bridge",
  "crates/tembra",
  "crates/browser-wasm",
  "crates/node-binding",
  "crates/executor-js",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tembra-core = { path = "crates/core", default-features = false }
tembra-bridge = { path = "crates/bridge", default-features = false }

[workspace.lints.rust]
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
