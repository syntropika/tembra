[workspace]
members = [
  "crates/core",
  "crates/contracts",
  "crates/contracts-wasm",
  "crates/bridge",
  "crates/tembra",
  "crates/runtime",
  "crates/browser-wasm",
  "crates/node-binding",
  "crates/executor-wasm",
  "crates/mobile",
  "crates/orb-macro",
  "crates/cargo-tembra",
]
resolver = "2"
exclude = [
  "crates/executor-wasm/guest",
  "crates/executor-wasm/rust-provider",
  "crates/executor-wasm/rust-consumer",
  "crates/executor-wasm/rust-contributor",
  "crates/executor-wasm/rust-http-client",
  "crates/executor-wasm/rust-sockets",
  "crates/executor-wasm/probe-provider",
  "crates/executor-wasm/stream-adapter",
  "examples/rust-orb/greeter",
  "examples/rust-orb/host",
  "examples/rust-orb-hooks/filter",
  "examples/rust-orb-hooks/host",
]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/syntropika/tembra"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tembra-runtime = { path = "crates/runtime", version = "=0.2.2", default-features = false }
tembra-core = { path = "crates/core", version = "=0.2.2", default-features = false }
tembra-contracts = { path = "crates/contracts", version = "=0.2.2" }
tembra-bridge = { path = "crates/bridge", version = "=0.2.2", default-features = false }

[workspace.lints.rust]
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Optimize the bytecode dispatch loop without increasing optimization across the host.
[profile.release.package.pulley-interpreter]
opt-level = 3

# Exercise interpreted execution within real deadlines while retaining test debug assertions.
[profile.test.package.pulley-interpreter]
opt-level = 3

# Keep guest compilation in tests representative without optimizing away host debug assertions.
[profile.test.package.cranelift-codegen]
opt-level = 3
