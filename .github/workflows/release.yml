name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Publish an existing tag with this workflow; leave empty for a build rehearsal
        type: string
        default: ""
      check_npm_auth:
        description: Check npm trusted publishers without publishing packages
        type: boolean
        default: false
      previous_npm_run:
        description: Reuse already published npm archives from a qualified release run of the same source
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  npm-authentication:
    if: github.event_name == 'workflow_dispatch' && inputs.check_npm_auth
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Check npm OIDC exchange for each package
        run: |
          node --input-type=module <<'NODE'
          const endpoint = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          endpoint.searchParams.set('audience', 'npm:registry.npmjs.org');
          const identity = await fetch(endpoint, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            signal: AbortSignal.timeout(30_000),
          });
          if (!identity.ok) throw new Error(`GitHub identity request failed: ${identity.status}`);
          const { value } = await identity.json();
          if (typeof value !== 'string' || !value) throw new Error('GitHub identity token is missing');
          console.log(`::add-mask::${value}`);
          const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString());
          console.log(JSON.stringify({ repository: claims.repository, workflow: claims.workflow_ref,
            audience: claims.aud, environment: claims.environment ?? null }));
          for (const name of ['engine-node', 'engine-wasm', 'sdk', 'react-native']) {
            const pkg = `@syntropika/tembra-${name}`;
            const escaped = pkg.replace('/', '%2f');
            try {
              const result = await fetch(`https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${escaped}`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${value}` },
                signal: AbortSignal.timeout(30_000),
              });
              let body;
              try { body = JSON.parse(await result.text()); } catch { /* Report status without untrusted response bytes. */ }
              if (result.ok && typeof body?.token === 'string' && body.token) {
                console.log(`::add-mask::${body.token}`);
                console.log(`${pkg}: OIDC exchange accepted`);
              } else {
                const message = String(body?.message ?? body?.error ?? 'Token exchange rejected')
                  .replaceAll(value, '<REDACTED>').replaceAll(/[\r\n]/g, ' ').slice(0, 500);
                console.error(`${pkg}: HTTP ${result.status}: ${message}`);
                process.exitCode = 1;
              }
            } catch {
              console.error(`${pkg}: token exchange request failed`);
              process.exitCode = 1;
            }
          }
          NODE

  validate:
    if: github.event_name != 'workflow_dispatch' || !inputs.check_npm_auth
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Check tag, versions and main ancestry
        id: tag
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          if [ "$RELEASE_EVENT" = push ] || [ -n "$RELEASE_TAG_INPUT" ]; then
            if [ "$RELEASE_EVENT" = workflow_dispatch ]; then
              test "$GITHUB_REF" = refs/heads/main
            fi
            tag="$RELEASE_REF"
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$(git rev-parse HEAD)"
            git merge-base --is-ancestor HEAD origin/main
          else
            tag="v$(bun -p 'require("./package.json").version')"
          fi
          bun scripts/release.ts validate "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Qualify previous npm archives before reuse
        if: inputs.previous_npm_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN: ${{ inputs.previous_npm_run }}
        run: |
          [[ "$PREVIOUS_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_RUN" > "$RUNNER_TEMP/previous-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_RUN/jobs?filter=latest&per_page=100" > "$RUNNER_TEMP/previous-jobs.json"
          previous=$(bun -e '
          const run = await Bun.file(`${process.env.RUNNER_TEMP}/previous-run.json`).json();
          const { jobs } = await Bun.file(`${process.env.RUNNER_TEMP}/previous-jobs.json`).json();
          if (run.repository.full_name !== process.env.GITHUB_REPOSITORY ||
              run.path !== ".github/workflows/release.yml" || run.status !== "completed")
            throw new Error("Previous artifacts must come from a completed release workflow in this repository");
          const required = jobs.filter(job => !["publish", "npm-authentication"].includes(job.name));
          if (required.some(job => job.conclusion !== "success") ||
              !["validate", "interpreter", "package", "ios", "android"].every(name => required.some(job => job.name === name)) ||
              required.filter(job => job.name.startsWith("node (")).length !== 6 ||
              required.filter(job => job.name.startsWith("quality / ")).length !== 8)
            throw new Error("Previous release platform, quality and package gates must all pass");
          console.log(run.head_sha);
          ')
          git fetch --no-tags origin "$previous"
          git diff --exit-code "$previous" HEAD -- Cargo.toml Cargo.lock rust-toolchain.toml package.json bun.lock mise.toml .node-version .bun-version crates packages scripts/native.ts
          previous_build=$(git show "$previous:justfile" | sed '/^    bun test scripts\/release/d')
          current_build=$(sed '/^    bun test scripts\/release/d' justfile)
          test "$previous_build" = "$current_build"

  quality:
    needs: validate
    uses: ./.github/workflows/quality.yml
    with:
      source_ref: ${{ needs.validate.outputs.ref }}

  interpreter:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: cargo install just --version 1.21.0 --locked
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ${{ runner.temp }}/wasi-sdk.tar.gz
            ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          key: wasi-sdk-34-linux-x64-b761e3a0721dbae9
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/interpreter
          key: interpreter-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/executor-wasm/guest/**', 'packages/ts/sdk/src/interpreter/**', 'justfile', 'bun.lock', 'rust-toolchain.toml') }}
      - name: Build the pinned interpreter for every package
        run: |
          rustup toolchain install "$(just --evaluate nightly)" --profile minimal --target wasm32-wasip1
          if [ ! -f "$RUNNER_TEMP/wasi-sdk.tar.gz" ]; then
            curl --fail --location --retry 3 https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz --output "$RUNNER_TEMP/wasi-sdk.tar.gz"
          fi
          printf '%s  %s\n' b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4 "$RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum --check
          if [ ! -x "$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux/bin/clang" ]; then
            tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          fi
          just build-interpreter "$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux" "$RUNNER_TEMP/interpreter"
          mkdir -p packages/ts/react-native/native/interpreter/tembra
          cp packages/ts/engine-node/dist/interpreter.wasm packages/ts/react-native/native/interpreter/tembra/interpreter.wasm
          cmp packages/ts/engine-node/dist/interpreter.wasm packages/ts/engine-wasm/dist/interpreter/interpreter.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: interpreter
          path: |
            packages/ts/engine-node/dist/interpreter.wasm
            packages/ts/engine-wasm/dist/interpreter
            packages/ts/react-native/native/interpreter
          if-no-files-found: error

  node:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: macos-15
            platform: darwin-arm64
          - os: windows-2022
            platform: win32-x64
          - os: windows-11-arm
            platform: win32-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: node packages/ts/engine-node/build.ts --features=hooks,subscriptions,views,telemetry
      - name: Load the release addon on its target platform
        run: node -e "const {NodeKernel}=require('./packages/ts/engine-node/index.cjs'); new NodeKernel()"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-${{ matrix.platform }}
          path: packages/ts/engine-node/dist/tembra-${{ matrix.platform }}.node
          if-no-files-found: error

  ios:
    needs: [validate, interpreter]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: interpreter
          path: packages/ts
      - run: bun run --cwd packages/ts/react-native build:ios
      - name: Remove debug information from distributed Apple libraries
        run: |
          find packages/swift/native/TembraFFI.xcframework packages/ts/react-native/native/swift/TembraFFI.xcframework \
            -name '*.a' -exec xcrun strip -S {} +
      - run: swift test --package-path packages/swift
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: react-native-ios
          path: packages/ts/react-native/native/swift
          if-no-files-found: error

  android:
    needs: [validate, interpreter]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: 8.11.1
          cache-disabled: true
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - run: cargo install cargo-ndk --locked --version 4.1.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: interpreter
          path: packages/ts
      - name: Build all Android ABIs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: bun run --cwd packages/ts/react-native build:android --abis arm64-v8a,armeabi-v7a,x86,x86_64
      - run: gradle -p packages/kotlin -PtembraAndroid=true :android:testReleaseUnitTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: react-native-android
          path: packages/ts/react-native/native/maven
          if-no-files-found: error

  package:
    needs: [validate, interpreter, quality, node, ios, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: cargo install wasm-bindgen-cli --locked --version 0.2.129
      - run: bun run --cwd packages/ts/engine-wasm build --features=hooks,subscriptions,views,telemetry
      - run: cargo install just --version 1.21.0 --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: interpreter
          path: packages/ts
      - name: Build the compiled smoke providers
        run: |
          rustup toolchain install "$(just --evaluate nightly)" --profile minimal --target wasm32-wasip3
          just build-provider "$RUNNER_TEMP/provider"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: node-*
          merge-multiple: true
          path: packages/ts/engine-node/dist
      - run: bun run --cwd packages/ts/sdk build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: react-native-ios
          path: packages/ts/react-native/native/swift
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: react-native-android
          path: packages/ts/react-native/native/maven
      - name: Pack npm artifacts
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: bun scripts/release.ts pack "$RELEASE_TAG" "$RUNNER_TEMP/release"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.previous_npm_run != ''
        with:
          name: npm-release
          run-id: ${{ inputs.previous_npm_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous-npm
      - name: Retain published archives and check package sizes
        env:
          PREVIOUS_RUN: ${{ inputs.previous_npm_run }}
        run: |
          git fetch --no-tags origin "$GITHUB_WORKFLOW_SHA"
          git show "$GITHUB_WORKFLOW_SHA:scripts/release/archives.ts" > "$RUNNER_TEMP/archives.ts"
          if [ -n "$PREVIOUS_RUN" ]; then
            bun "$RUNNER_TEMP/archives.ts" reuse "$RUNNER_TEMP/release/npm" "$RUNNER_TEMP/previous-npm"
          fi
          bun "$RUNNER_TEMP/archives.ts" check "$RUNNER_TEMP/release/npm/"*.tgz
      - name: Verify standalone crate archives
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: bun scripts/release.ts package-crates "$RELEASE_TAG"
      - name: Build the browser qualification fixture
        run: |
          bun --eval '
          import { copyFile, mkdir, writeFile } from "node:fs/promises";
          import path from "node:path";
          import { build } from "./packages/ts/sdk/src/tooling/index.ts";
          const root = path.join(process.env.RUNNER_TEMP, "release-fixtures");
          await mkdir(root, { recursive: true });
          await writeFile(path.join(root, "contract.wit"), `
            package example:integrated@1.0.0;
            interface arithmetic { double: func(value: s32) -> s32; }
            world arithmetic-provider { export arithmetic; }
          `);
          const guest = JSON.stringify(path.resolve("packages/ts/sdk/src/guest.ts"));
          await writeFile(path.join(root, "orb.ts"), `
            import { orb } from ${guest};
            export default orb({ name: "arithmetic", apiVersion: 1,
              services: { arithmetic: { methods: {
                double(_environment: unknown, _context: unknown, value: number) { return value * 2; }
              } } }
            });
          `);
          const [artifact] = await build({ root, outDir: root, builds: {
            "arithmetic-source": { entry: "orb.ts", wit: "contract.wit", world: "arithmetic-provider" }
          } });
          await copyFile(artifact.path, path.join(root, "arithmetic-source.wasm"));
          '
      - name: Install packed packages, typecheck a NodeNext consumer and execute isolated Orbs
        run: |
          google-chrome --version
          bun scripts/release/smoke.ts "$RUNNER_TEMP/release/npm" "$RUNNER_TEMP/release-smoke" --provider "$RUNNER_TEMP/provider/wasm32-wasip3/release/tembra_wasm_arithmetic.wasm" --browser-orb "$RUNNER_TEMP/release-fixtures/arithmetic-source.wasm"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release
          path: ${{ runner.temp }}/release/npm
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crate-release
          path: target/package/*.crate
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [validate, package]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      USE_CRATES_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release
          path: ${{ runner.temp }}/release/npm
      - name: Authenticate to crates.io with OIDC
        id: crates
        if: env.USE_CRATES_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crate-release
          path: ${{ runner.temp }}/release/crates
      - name: Publish crates in dependency order
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.crates.outputs.token }}
        run: bun scripts/release.ts publish-crates "$RELEASE_TAG" "$RUNNER_TEMP/release/crates"
      - name: Publish npm archives in dependency order
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun scripts/release.ts publish-npm "$RELEASE_TAG" "$RUNNER_TEMP/release/npm"
