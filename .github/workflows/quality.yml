name: Quality
on: [push, pull_request, workflow_call]
permissions:
  contents: read

# New commits supersede branch checks; protected main and release validation finish normally.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      # Restore dependencies and pinned Cargo tools, then let Cargo validate every build.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: ubuntu-24.04-${{ hashFiles('justfile', 'crates/executor-wasm/*/Cargo.toml', 'crates/executor-wasm/*/Cargo.lock') }}
      - run: cargo install just --version 1.21.0 --locked
      - run: just install-tools
      - run: just install
      - run: just check

  # Build the pinned interpreter and compiled provider once, then run every isolated Orb suite.
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: ubuntu-24.04-${{ hashFiles('justfile', 'crates/executor-wasm/*/Cargo.toml', 'crates/executor-wasm/*/Cargo.lock') }}
          workspaces: |
            . -> target
            crates/executor-wasm/rust-provider -> ${{ runner.temp }}/provider
            crates/executor-wasm/stream-adapter -> ${{ runner.temp }}/stream-adapter
            crates/executor-wasm/rust-http-handler -> ${{ runner.temp }}/http-handler/handler
            crates/executor-wasm/rust-http-handler -> ${{ runner.temp }}/http-handler/proxy
      - run: cargo install just --version 1.21.0 --locked
      - run: just install-tools
      - run: just install
      # Exercise the optimized Node package used by published consumers.
      - run: bun run --cwd packages/ts/engine-node build --features=hooks,subscriptions,views,telemetry
      - run: bun run --cwd packages/ts/engine-wasm build --features=hooks,subscriptions,views,telemetry
      # Keep the compiler SDK and verified source/build cache reusable across branch commits.
      # The interpreter build still verifies the pinned checkout, patches, ABI and output bytes.
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ${{ runner.temp }}/wasi-sdk.tar.gz
            ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          key: wasi-sdk-34-linux-x64-b761e3a0721dbae9
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/interpreter
          key: interpreter-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/executor-wasm/guest/**', 'packages/ts/sdk/src/interpreter/**', 'justfile', 'bun.lock', 'rust-toolchain.toml') }}
      - name: Build the pinned interpreter into both engine packages
        run: |
          rustup toolchain install "$(just --evaluate nightly)" --profile minimal --target wasm32-wasip1 --target wasm32-wasip3 --target wasm32-unknown-unknown
          if [ ! -f "$RUNNER_TEMP/wasi-sdk.tar.gz" ]; then
            curl --fail --location --retry 3 https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz --output "$RUNNER_TEMP/wasi-sdk.tar.gz"
          fi
          printf '%s  %s\n' b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4 "$RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum --check
          if [ ! -x "$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux/bin/clang" ]; then
            tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          fi
          just build-interpreter "$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux" "$RUNNER_TEMP/interpreter"
      - run: just build-sdk
      - run: just check-stream-adapter "$RUNNER_TEMP/stream-adapter"
      - run: just build-provider "$RUNNER_TEMP/provider"
      - run: just build-probe "$RUNNER_TEMP/provider"
      - run: just build-consumer "$RUNNER_TEMP/provider"
      - run: just build-keyed-router "$RUNNER_TEMP/provider"
      - run: just build-resources "$RUNNER_TEMP/provider"
      - run: just build-streams "$RUNNER_TEMP/provider"
      - run: just build-contributor "$RUNNER_TEMP/provider"
      - run: just build-http-client "$RUNNER_TEMP/provider"
      - run: just build-sockets "$RUNNER_TEMP/provider"
      - run: just build-system "$RUNNER_TEMP/provider"
      - run: just build-filesystem "$RUNNER_TEMP/provider"
      - run: just build-http-handler "$RUNNER_TEMP/http-handler"
      # The runner image provides Google Chrome; fail here if that changes.
      - run: google-chrome --version
      - name: Qualify all Orb artifacts
        shell: bash
        run: >-
          just test-wasm-acceptance --out "$RUNNER_TEMP/acceptance"
          --provider "$RUNNER_TEMP/provider/wasm32-wasip3/release/tembra_wasm_arithmetic.wasm"
          --probe "$RUNNER_TEMP/provider/wasm32-unknown-unknown/release/tembra_wasm_probe.wasm"
          --consumer "$RUNNER_TEMP/provider/wasm32-unknown-unknown/release/tembra_wasm_pipeline.wasm"
          --keyed-router "$RUNNER_TEMP/provider/wasm32-unknown-unknown/release/tembra_wasm_keyed_router.wasm"
          --contributor "$RUNNER_TEMP/provider/wasm32-unknown-unknown/release/tembra_wasm_contributor.wasm"
          --http-client "$RUNNER_TEMP/provider/wasm32-unknown-unknown/release/tembra_wasm_http_client.wasm"
          --sockets "$RUNNER_TEMP/provider/wasm32-unknown-unknown/release/tembra_wasm_sockets.wasm"
          --system "$RUNNER_TEMP/provider/wasm32-unknown-unknown/release/tembra_wasm_system.wasm"
          --filesystem "$RUNNER_TEMP/provider/wasm32-unknown-unknown/release/tembra_wasm_filesystem.wasm"
          --http-handler "$RUNNER_TEMP/http-handler/handler/wasm32-unknown-unknown/release/tembra_wasm_http_handler.wasm"
          --http-proxy "$RUNNER_TEMP/http-handler/proxy/wasm32-unknown-unknown/release/tembra_wasm_http_handler.wasm"
          --resource-provider "$RUNNER_TEMP/provider/wasm32-unknown-unknown/release/tembra_wasm_resource_provider.wasm"
          --resource-consumer "$RUNNER_TEMP/provider/wasm32-unknown-unknown/release/tembra_wasm_resource_consumer.wasm"
          --stream-producer "$RUNNER_TEMP/provider/wasm32-unknown-unknown/release/tembra_wasm_stream_producer.wasm"
          --stream-consumer "$RUNNER_TEMP/provider/wasm32-unknown-unknown/release/tembra_wasm_stream_consumer.wasm"
          2>&1 | tee "$RUNNER_TEMP/acceptance.log"
      - name: Test portable mobile execution and foreign continuation delivery
        run: just test-mobile-wasm packages/ts/engine-node/dist/interpreter.wasm "$RUNNER_TEMP/provider/wasm32-wasip3/release/tembra_wasm_arithmetic.wasm" "$RUNNER_TEMP/provider/wasm32-unknown-unknown/release/tembra_wasm_probe.wasm" "$RUNNER_TEMP/http-handler/handler/wasm32-unknown-unknown/release/tembra_wasm_http_handler.wasm" "$RUNNER_TEMP/provider/wasm32-unknown-unknown/release/tembra_wasm_keyed_router.wasm"
      - name: Preserve acceptance timings and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acceptance-log
          path: ${{ runner.temp }}/acceptance.log
          if-no-files-found: ignore
          retention-days: 7
