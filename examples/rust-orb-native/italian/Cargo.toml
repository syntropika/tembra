[package]
name = "tembra-example-italian"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

# Read by `cargo tembra build` for the component and by the macro for `orb()`: the Orb name and API
# version, which the WIT does not carry.
[package.metadata.tembra]
name = "italian"
api-version = 1

[dependencies]
# The facade's authoring entry point, without the host runtime. A native host that depends on this
# crate enables the facade's `host` feature, and Cargo unifies it here: the module then has `orb()`.
tembra = { path = "../../../crates/tembra", default-features = false, features = ["macros"] }
# The code generated by the macro names wit-bindgen; std supplies the guest runtime.
wit-bindgen = { version = "=0.63.0", default-features = false, features = ["macros", "realloc"] }

[package.metadata.cargo-machete]
ignored = ["wit-bindgen"]

[profile.release]
panic = "abort"
opt-level = 3
lto = true
strip = "symbols"
