[package]
name = "typescript-http-orb"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tembra = { path = "../../crates/tembra", features = ["hooks"] }
ureq = { version = "=3.1.2", default-features = false }
wasmtime = { version = "=50.0.1", default-features = false, features = [
  "anyhow",
  "component-model",
  "async",
  "cranelift",
  "runtime",
  "std",
] }

[profile.release]
debug = 0
