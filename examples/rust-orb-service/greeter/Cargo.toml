[package]
name = "tembra-example-greeter"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

# Read by `cargo tembra build`: the Orb name and API version, which the WIT does not carry.
[package.metadata.tembra]
name = "greeter"
api-version = 1

[dependencies]
tembra = { path = "../../../crates/tembra", default-features = false, features = ["macros"] }
# The generated code names no other crate: std supplies the guest runtime.

[profile.release]
panic = "abort"
opt-level = 3
lto = true
strip = "symbols"
