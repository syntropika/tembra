[package]
name = "tembra-example-filter"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

# Read by `cargo tembra build`: the Orb name and API version, and the priority of its contribution.
[package.metadata.tembra]
name = "filter"
api-version = 1
contributes = { "example:admission/guard@1.0.0" = -7 }

[dependencies]
tembra-orb-macro = { path = "../../../crates/orb-macro" }
# The code generated by the macro names these two crates.
wit-bindgen = { version = "=0.63.0", default-features = false, features = ["macros", "realloc"] }
dlmalloc = { version = "0.2.12", features = ["global"] }

[package.metadata.cargo-machete]
ignored = ["wit-bindgen", "dlmalloc"]

[profile.release]
panic = "abort"
opt-level = 3
lto = true
strip = "symbols"
