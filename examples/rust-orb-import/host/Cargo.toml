[package]
name = "tembra-example-import-host"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

# The wiring that installs the greeter and the welcomer, binding the welcomer's import to the
# greeter, and calls the welcomer; it defines no Orb.
[dependencies]
tembra = { path = "../../../crates/tembra", features = ["wasm"] }
futures = "0.3"
serde_json = "1"
