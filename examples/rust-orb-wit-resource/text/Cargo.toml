[package]
name = "tembra-example-text"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

# Read by `cargo tembra build`: the Orb name and API version, which the WIT does not carry.
[package.metadata.tembra]
name = "text"
api-version = 1

[dependencies]
tembra = { path = "../../../crates/tembra", default-features = false, features = ["macros"] }
# The code generated by the macro names these two crates.
wit-bindgen = { version = "=0.63.0", default-features = false, features = ["macros", "realloc"] }
dlmalloc = { version = "0.2.12", features = ["global"] }

[package.metadata.cargo-machete]
ignored = ["wit-bindgen", "dlmalloc"]

[profile.release]
panic = "abort"
opt-level = 3
lto = true
strip = "symbols"
