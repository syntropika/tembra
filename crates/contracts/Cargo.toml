[package]
name = "tembra-contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WIT contracts and prepared Orb declarations for Tembra"

[features]
default = ["authoring"]
# WIT resolution, artifact packaging and real compiled-component verification.
# Runtimes that only execute source Orbs (the browser) disable it and ship no WIT parser.
authoring = ["dep:anyhow", "dep:wit-parser", "dep:wit-component"]

[dependencies]
heck = "0.5"
tembra-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
# Shared source runtime packaging, checking and expansion (`src/shared.rs`, `src/shared_runtime.rs`).
wasmparser = "=0.262.0"
wasm-encoder = { version = "=0.262.0", features = ["wasmparser"] }
anyhow = { version = "1", optional = true }
wit-parser = { version = "=0.262.0", optional = true }
wit-component = { version = "=0.262.0", optional = true }

[dev-dependencies]
tempfile = "3"
wit-component = { version = "=0.262.0", features = ["dummy-module"] }
wat = "=1.263.0"

[[bin]]
name = "tembra-contract"
required-features = ["authoring"]

[lints]
workspace = true
