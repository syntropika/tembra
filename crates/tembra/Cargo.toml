[package]
name = "tembra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed Rust orbs and optional isolated WebAssembly execution for Tembra"

[[example]]
name = "counter"
path = "../../examples/rust/host.rs"

[[example]]
name = "addresses"
path = "../../examples/rust/addresses.rs"

[[example]]
name = "lifetime"
path = "../../examples/rust/lifetime.rs"

[[example]]
name = "executor"
path = "../../examples/rust/executor.rs"

[[example]]
name = "hooks"
path = "../../examples/rust/hooks.rs"
required-features = ["hooks"]

[[example]]
name = "composition"
path = "../../examples/rust/composition.rs"

[[example]]
name = "rpc"
path = "../../examples/rust/rpc.rs"
required-features = ["rpc", "views"]

[[example]]
name = "wasm"
path = "../../examples/rust/wasm.rs"
required-features = ["wasm"]

[features]
default = ["host"]
host = ["dep:tembra-runtime"]
# Guest crates enable macros without linking the application's host implementation.
macros = ["dep:tembra-orb-macro"]
contracts = ["dep:tembra-contracts"]
# WIT parsing and artifact packaging are build-time tools, separate from prepared contracts.
authoring = ["contracts", "tembra-contracts/authoring"]
# Native Wasmtime execution is optional and never compiled into the browser target.
wasm = ["host", "contracts", "dep:tembra-executor-wasm"]
rpc = ["host", "tembra-runtime/rpc"]
hooks = ["host", "tembra-runtime/hooks"]
subscriptions = ["host", "tembra-runtime/subscriptions"]
views = ["host", "tembra-runtime/views"]
telemetry = ["host", "tembra-runtime/telemetry"]

[dependencies]
tembra-runtime = { workspace = true, optional = true }
tembra-contracts = { workspace = true, default-features = false, optional = true }
tembra-orb-macro = { path = "../orb-macro", version = "=0.2.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tembra-executor-wasm = { path = "../executor-wasm", version = "=0.2.2", optional = true }

[dev-dependencies]
futures-timer = "3"
futures.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }

[[test]]
name = "contract_facade"
required-features = ["authoring"]

[lints]
workspace = true
