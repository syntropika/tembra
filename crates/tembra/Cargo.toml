[package]
name = "tembra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Typed Rust contracts, providers and managed references for Tembra"

[features]
default = []
native = ["dep:tembra-native", "dep:tokio"]

[dependencies]
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tembra-core.workspace = true
tembra-contracts.workspace = true
tembra-macros.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tembra-native = { path = "../native", optional = true }
tokio = { version = "1.53.3", features = ["rt", "time", "net"], optional = true }

[lints]
workspace = true
