[package]
name = "tembra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed Rust orbs and optional isolated WebAssembly execution for Tembra"

[[example]]
name = "counter"
path = "../../examples/rust/host.rs"

[[example]]
name = "addresses"
path = "../../examples/rust/addresses.rs"

[[example]]
name = "lifetime"
path = "../../examples/rust/lifetime.rs"

[[example]]
name = "executor"
path = "../../examples/rust/executor.rs"

[[example]]
name = "hooks"
path = "../../examples/rust/hooks.rs"
required-features = ["hooks"]

[[example]]
name = "composition"
path = "../../examples/rust/composition.rs"

[[example]]
name = "rpc"
path = "../../examples/rust/rpc.rs"
required-features = ["rpc", "views"]

[[example]]
name = "wasm"
path = "../../examples/rust/wasm.rs"
required-features = ["wasm"]

[features]
default = []
# Native Wasmtime execution is optional and never compiled into the browser target.
wasm = ["dep:tembra-executor-wasm"]
rpc = ["tembra-runtime/rpc"]
hooks = ["tembra-runtime/hooks"]
subscriptions = ["tembra-runtime/subscriptions"]
views = ["tembra-runtime/views"]
telemetry = ["tembra-runtime/telemetry"]

[dependencies]
tembra-runtime.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tembra-executor-wasm = { path = "../executor-wasm", version = "=0.2.2", optional = true }

[dev-dependencies]
futures-timer = "3"
futures.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }

[lints]
workspace = true
