[package]
name = "tembra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Managed Rust facets and native execution for Tembra"

[features]
default = []
hooks = ["tembra-core/hooks"]
subscriptions = ["tembra-core/subscriptions"]
views = ["tembra-core/views"]
telemetry = ["tembra-core/telemetry"]
review = ["hooks", "subscriptions", "views"]

[dependencies]
tembra-core.workspace = true
futures.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }

[lints]
workspace = true
