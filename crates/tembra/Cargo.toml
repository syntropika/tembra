[package]
name = "tembra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Managed Rust orbs and native execution for Tembra"

[[example]]
name = "counter"
path = "../../examples/rust/host.rs"

[[example]]
name = "addresses"
path = "../../examples/rust/addresses.rs"

[[example]]
name = "lifetime"
path = "../../examples/rust/lifetime.rs"

[[example]]
name = "executor"
path = "../../examples/rust/executor.rs"

[[example]]
name = "hooks"
path = "../../examples/rust/hooks.rs"
required-features = ["hooks"]

[[example]]
name = "composition"
path = "../../examples/rust/composition.rs"

[features]
default = []
hooks = ["tembra-core/hooks"]
subscriptions = ["tembra-core/subscriptions"]
views = ["tembra-core/views"]
telemetry = ["tembra-core/telemetry"]

[dependencies]
tembra-core.workspace = true
futures.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }
futures-timer = "3"

[lints]
workspace = true
