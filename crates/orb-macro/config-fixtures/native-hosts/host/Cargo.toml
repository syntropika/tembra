tembra-example-harbor = { path = "../../../../../examples/rust-orb-service-resource/harbor" }
tembra-example-book = { path = "../../../../../examples/rust-orb-shared-interface/book" }
tembra-example-counter = { path = "../../../../../examples/rust-orb-state/counter" }
tembra-example-speller = { path = "../../../../../examples/rust-orb-wit-resource/speller" }
tembra-example-text = { path = "../../../../../examples/rust-orb-wit-resource/text" }
