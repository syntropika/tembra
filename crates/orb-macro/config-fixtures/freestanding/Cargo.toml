[package]
name = "tembra-config-freestanding"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[features]
# The facade's features that link std, which a guest gets from another crate of its build: with
# either, std's panic handler serves in place of the module's.
host = ["tembra/host"]
contracts = ["tembra/contracts"]

[dependencies]
# What a `no_std` guest depends on, as `examples/rust-orb-import/greeter` does.
tembra = { path = "../../../tembra", default-features = false, features = ["macros"] }
dlmalloc = { version = "0.2.12", features = ["global"] }

[package.metadata.cargo-machete]
ignored = ["dlmalloc"]
