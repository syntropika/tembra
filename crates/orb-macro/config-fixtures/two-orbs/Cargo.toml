[package]
name = "tembra-config-two-orbs"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# What a guest depends on: the facade's authoring entry point, without the host runtime.
tembra = { path = "../../../tembra", default-features = false, features = ["macros"] }
# The code generated by the macro names these crates for a state.
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[package.metadata.cargo-machete]
ignored = ["serde", "serde_json"]
