[package]
name = "tembra-orb-host-feature-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
# The facade's `host` feature, which a guest gets when its `tembra` keeps the default features, or
# from another crate of the build: a build for wasm32 is a component all the same, which
# `executor-wasm/tests/orb_macro_runtime.rs` checks.
host = ["tembra/host"]
# The facade's `contracts`, which links std without `host`.
contracts = ["tembra/contracts"]
# The crate without std on wasm32, on the module's freestanding runtime: with `host` or
# `contracts`, the facade links std, whose panic handler then serves in place of the module's.
no-std = ["dep:dlmalloc"]

[dependencies]
tembra = { path = "../../tembra", default-features = false, features = ["macros"] }
dlmalloc = { version = "0.2.12", features = ["global"], optional = true }

[package.metadata.cargo-machete]
ignored = ["dlmalloc"]

# The runtime fixture's, so that a build shares its dependencies in the fixtures' target directory.
[profile.release]
panic = "abort"
opt-level = "z"
lto = true
strip = "symbols"
