[package]
name = "tembra-orb-macro-async-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[features]
# The facade's `host`, for the native build `just test-orb-both-ways` makes: with the feature, the
# lockfile pins the runtime that `host` brings.
host = ["tembra/host"]

[dependencies]
tembra = { path = "../../tembra", default-features = false, features = ["macros"] }
dlmalloc = { version = "0.2.12", features = ["global"] }

[package.metadata.cargo-machete]
ignored = ["dlmalloc"]

[profile.release]
panic = "abort"
opt-level = 3
lto = true
strip = "symbols"
