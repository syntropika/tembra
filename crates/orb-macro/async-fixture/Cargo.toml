[package]
name = "tembra-orb-macro-async-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
tembra = { path = "../../tembra", default-features = false, features = ["macros"] }
wit-bindgen = { version = "=0.63.0", default-features = false, features = [
  "macros",
  "realloc",
  "async",
] }
dlmalloc = { version = "0.2.12", features = ["global"] }

[package.metadata.cargo-machete]
ignored = ["wit-bindgen", "dlmalloc"]

[profile.release]
panic = "abort"
opt-level = 3
lto = true
strip = "symbols"
