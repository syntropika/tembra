[package]
name = "tembra-orb-macro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Derives the WIT contract and the component bindings of a compiled Orb from a Rust module"

[lib]
proc-macro = true

[dependencies]
# `authoring` resolves the derived WIT as a contract, for the signatures and the contract the
# macro writes; a proc-macro dependency, so a guest build links none of it.
tembra-contracts = { workspace = true, default-features = false, features = ["authoring"] }
heck = "0.5"
proc-macro2 = "1"
quote = "1"
serde.workspace = true
serde_json.workspace = true
syn = { version = "2", features = ["full"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
wit-parser = "=0.261.0"
wit-component = "=0.261.0"

[dev-dependencies]
# The tests read the source text an error falls on.
proc-macro2 = { version = "1", features = ["span-locations"] }

[lints]
workspace = true
