[package]
name = "tembra-orb-macro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Derives the WIT contract and the component bindings of a compiled Orb from a Rust module"
publish = false

[lib]
proc-macro = true

[dependencies]
heck = "0.5"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
toml = "0.8"
wit-parser = "=0.262.0"

[dev-dependencies]
# The macro keeps a copy of the private `tembra:orb` package; a test keeps it identical.
tembra-contracts = { workspace = true, default-features = false }

[lints]
workspace = true
