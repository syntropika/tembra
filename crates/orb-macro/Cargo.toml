[package]
name = "tembra-orb-macro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Derives the WIT contract and the component bindings of a compiled Orb from a Rust module"

[lib]
proc-macro = true

[dependencies]
tembra-contracts = { workspace = true, default-features = false }
heck = "0.5"
proc-macro2 = "1"
quote = "1"
serde.workspace = true
syn = { version = "2", features = ["full"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
wit-parser = "=0.261.0"

[lints]
workspace = true
