[package]
name = "tembra-executor-js"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Optional V8 execution adapter for Tembra"

[features]
default = []
hooks = ["tembra/hooks", "tembra-bridge/hooks"]
subscriptions = ["tembra/subscriptions", "tembra-bridge/subscriptions"]
views = ["tembra/views", "tembra-bridge/views"]

[dependencies]
tembra = { path = "../tembra", version = "=0.1.0" }
tembra-bridge.workspace = true
serde_json.workspace = true
futures.workspace = true
deno_core = { version = "=0.412.0", default-features = false, features = [
  "v8",
  "v8_use_custom_libcxx",
  "reactor-tokio",
] }
deno_error = "0.7.1"
tokio = { version = "1.53.3", features = ["rt", "time"] }

[lints]
workspace = true
