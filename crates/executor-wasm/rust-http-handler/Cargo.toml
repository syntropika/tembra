[package]
name = "tembra-wasm-http-handler"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[features]
# Select the `proxy` world, which also imports the outgoing client.
proxy = []

[dependencies]
# `async-spawn` lets the response body producer keep running after `handle` returned, inside the
# same export task.
wit-bindgen = { version = "=0.63.0", default-features = false, features = [
  "macros",
  "realloc",
  "async",
  "async-spawn",
] }
dlmalloc = { version = "0.2.12", features = ["global"] }

[build-dependencies]
tembra-contracts = { path = "../../contracts" }

# The official macro invocation is generated into OUT_DIR by the build script.
[package.metadata.cargo-machete]
ignored = ["wit-bindgen"]

[profile.release]
panic = "abort"
opt-level = 3
lto = true
strip = "symbols"
