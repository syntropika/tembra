[package]
name = "tembra-wasm-stream-consumer"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Same pins as the stream producer, so both build from one offline lock.
wit-bindgen = { version = "=0.63.0", default-features = false, features = [
  "macros",
  "realloc",
  "async",
  "async-spawn",
] }
dlmalloc = { version = "0.2.12", features = ["global"] }

[profile.release]
panic = "abort"
opt-level = 3
lto = true
strip = "symbols"
