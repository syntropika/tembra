[package]
name = "tembra-executor-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Isolated WebAssembly execution over the Tembra host"
publish = false

[[example]]
name = "wasm"
path = "../../examples/rust/wasm.rs"

[dependencies]
tembra = { path = "../tembra", version = "=0.2.2", features = ["hooks"] }
tembra-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
futures.workspace = true
futures-timer = "3"
rayon = "1"
async-channel = "2"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
wasmtime = { version = "=51.0.0-rc.1", default-features = false, features = [
  "anyhow",
  "component-model",
  "component-model-async",
  "async",
  "cranelift",
  "parallel-compilation",
  "pulley",
  "runtime",
  "std",
  "task-group-hook",
] }
wasmtime-wasi = { version = "=51.0.0-rc.1", default-features = false, features = ["p2", "p3"] }
# Standard P3 `wasi:http` host (fields, requests, responses, bodies). Sends go through Tembra's
# own `WasiHttpHooks` transport (`src/http`), not upstream's default sender.
wasmtime-wasi-http = { version = "=51.0.0-rc.1", default-features = false, features = ["p3"] }
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
# Host transport behind the public `WasiHttpHooks::send_request` seam (versions and features
# match the pinned upstream default sender's, so the lockfile gains no packages).
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "tls12",
  "logging",
  "std",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "tls12",
  "logging",
] }
webpki-roots = "1"
url = "2.5"

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
wat = "=1.263.0"
wit-component = "=0.262.0"
wit-parser = "=0.262.0"
