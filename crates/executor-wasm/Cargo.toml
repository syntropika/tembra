[package]
name = "tembra-executor-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Isolated WebAssembly execution over the Tembra host"
publish = false

[[example]]
name = "wasm"
path = "../../examples/rust/wasm.rs"

[dependencies]
tembra = { path = "../tembra", version = "=0.2.2", features = ["hooks"] }
tembra-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
futures.workspace = true
futures-timer = "3"
rayon = "1"
async-channel = "2"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
wasmtime = { version = "=51.0.0-rc.1", default-features = false, features = [
  "anyhow",
  "component-model",
  "component-model-async",
  "async",
  "cranelift",
  "parallel-compilation",
  "pulley",
  "runtime",
  "std",
  "task-group-hook",
] }
wasmtime-wasi = { version = "=51.0.0-rc.1", default-features = false, features = ["p2", "p3"] }
# Standard WASI HTTP: hyper/rustls/DNS client and P3 `wasi:http` host. Source Orbs reuse its sender.
wasmtime-wasi-http = { version = "=51.0.0-rc.1", default-features = false, features = [
  "default-send-request",
  "p3",
] }
bytes = "1"
http = "1"
http-body-util = "0.1"
url = "2.5"

[build-dependencies]
sha2 = "0.10"
wit-parser = "=0.261.0"

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
wat = "=1.263.0"
wit-component = "=0.261.0"
wit-parser = "=0.261.0"
