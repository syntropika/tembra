[package]
name = "tembra-executor-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Isolated WebAssembly execution over the Tembra host"
publish = false

[[example]]
name = "wasm"
path = "../../examples/rust/wasm.rs"

[dependencies]
cap-std = "=4.0.3"
tembra = { path = "../tembra", version = "=0.2.2" }
tembra-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
futures.workspace = true
futures-timer = "3"
rayon = "1"
async-channel = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
wasmtime = { version = "=51.0.0-rc.1", default-features = false, features = [
  "anyhow",
  "component-model",
  "component-model-async",
  "async",
  "cranelift",
  "parallel-compilation",
  "pulley",
  "runtime",
  "std",
] }
wasmtime-wasi = { version = "=51.0.0-rc.1", default-features = false, features = ["p2", "p3"] }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
