[package]
name = "tembra-stream-adapter"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Private guest adapter that reads and closes upstream socket output streams for source Orbs"

# Built separately for wasm32 (`just build-stream-adapter`); the executor embeds the reviewed
# prebuilt component, so no build of this crate happens inside a host build.
[workspace]

[lib]
crate-type = ["cdylib"]

# The prebuilt component bundles these crates: wit-bindgen (Apache-2.0 WITH LLVM-exception OR
# Apache-2.0 OR MIT) and dlmalloc (MIT OR Apache-2.0).
[dependencies]
wit-bindgen = { version = "=0.63.0", default-features = false, features = [
  "macros",
  "realloc",
  "async",
] }
dlmalloc = { version = "0.2.12", features = ["global"] }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
