[package]
name = "tembra-dquickts"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
rquickjs = { git = "https://github.com/stencil-hq/dquickts", rev = "b51e92c0c7ca3b0ae7afff1a1f2de8baf2e7a34a", default-features = false, features = [
  "std",
  "bindgen",
] }
wit-bindgen = { version = "=0.63.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
strip = "symbols"
lto = true
