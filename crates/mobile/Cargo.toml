[package]
name = "tembra-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Thread-safe Swift and Kotlin bindings for the Tembra metadata kernel"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "tembra-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[features]
default = ["hooks", "subscriptions", "views", "telemetry"]
hooks = ["tembra-bridge/hooks"]
subscriptions = ["tembra-bridge/subscriptions"]
views = ["tembra-bridge/views"]
telemetry = ["tembra-bridge/telemetry"]
bindgen = ["uniffi/cli"]

[dependencies]
tembra-bridge.workspace = true
uniffi = "=0.32.2"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
