[package]
name = "tembra-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Swift and Kotlin bindings for the Tembra kernel and isolated Wasm execution"
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "tembra-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[features]
default = ["hooks", "subscriptions", "views", "telemetry"]
hooks = ["tembra-bridge/hooks"]
subscriptions = ["tembra-bridge/subscriptions"]
views = ["tembra-bridge/views"]
telemetry = ["tembra-bridge/telemetry"]
bindgen = ["uniffi/cli"]

[dependencies]
tembra-bridge.workspace = true
tembra-executor-wasm = { path = "../executor-wasm" }
tembra-contracts.workspace = true
tembra = { path = "../tembra" }
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
uniffi = "=0.32.2"

[dev-dependencies]
tempfile = "3"
wat = "=1.263.0"
wit-component = "=0.261.0"
wit-parser = "=0.261.0"

[lints]
workspace = true
