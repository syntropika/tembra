[package]
name = "tembra-browser-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly adapter for the Tembra metadata kernel"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
hooks = ["tembra-bridge/hooks"]
subscriptions = ["tembra-bridge/subscriptions"]
views = ["tembra-bridge/views"]
telemetry = ["tembra-bridge/telemetry"]

[dependencies]
tembra-bridge.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[lints]
workspace = true
