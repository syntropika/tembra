[package]
name = "tembra-contracts-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser binding for prepared Tembra Orb contracts"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Runtime model only: no WIT parser, component decoder or compiled-component verifier.
tembra-contracts = { path = "../contracts", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[dev-dependencies]
serde_json.workspace = true
# Independent digest for prepared-component binding tests (already linked by tembra-contracts).
sha2 = "0.10"

[lints]
workspace = true
