[package]
name = "tembra-node-binding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "=3.14.2", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "=3.6.12"
tembra-core.workspace = true
tembra-hooks.workspace = true
tembra-contracts.workspace = true
tembra-native = { path = "../native" }
futures.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.3", features = ["rt", "time", "net"] }

[build-dependencies]
napi-build = "=2.6.0"

[lints]
workspace = true
