[package]
name = "tembra-node-binding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []
hooks = ["tembra-bridge/hooks"]
subscriptions = ["tembra-bridge/subscriptions"]
views = ["tembra-bridge/views"]
telemetry = ["tembra-bridge/telemetry"]

[dependencies]
napi = { version = "=3.14.2", default-features = false, features = [
  "napi8",
  "dyn-symbols",
  "serde-json",
] }
napi-derive = "=3.6.12"
tembra-bridge.workspace = true
tembra-contracts.workspace = true
tembra-executor-wasm = { path = "../executor-wasm", version = "=0.2.2" }
tembra = { path = "../tembra", version = "=0.2.2" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
# Browser component preparation (build time only): exact component import names and
# fuel/page instrumentation of generated core modules. Same pins as Wasmtime's own.
wasmparser = "=0.263.0"
wasm-encoder = { version = "=0.263.0", features = ["wasmparser"] }

[dev-dependencies]
# Limit tests execute instrumented modules; same pins and features as tembra-executor-wasm.
wat = "=1.263.0"
wasmtime = { version = "=51.0.0-rc.1", default-features = false, features = [
  "anyhow",
  "component-model",
  "component-model-async",
  "async",
  "cranelift",
  "parallel-compilation",
  "pulley",
  "runtime",
  "std",
  "task-group-hook",
] }

[build-dependencies]
napi-build = "=2.6.0"

[lints]
workspace = true
