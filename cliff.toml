[changelog]
header = """
# Changelog

Changes are grouped by Conventional Commit type.
"""
body = """
{% if version %}
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}**breaking:** {% endif %}{{ commit.message | split(pat="\n") | first }} (`{{ commit.id | truncate(length=7, end="") }}`)
{% endfor %}
{% endfor %}
"""
footer = "\n"
trim = true
render_always = true
format = true

[git]
conventional_commits = true
require_conventional = true
filter_unconventional = false
filter_commits = false
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs?", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^(build|ci|chore)", group = "Build and tooling" },
  { message = "^style", group = "Style" },
  { message = "^revert", group = "Reverts" },
  { message = ".*", group = "Other" },
]
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+.*$"
sort_commits = "oldest"
